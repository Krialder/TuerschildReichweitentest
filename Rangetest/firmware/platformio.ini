[platformio]
default_envs = sender

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; ===================================================================
; Manuelle Build-Envs.
; Der Topologie-Wizard im Dashboard pflegt zusaetzlich einen
; AUTO-TOPOLOGY-Block am Dateiende mit dynamisch erzeugten Envs
; (Praefix auto_*).
; ===================================================================

; ESP-NOW: 2,4 GHz, kein Duty-Cycle.
; ESPNOW_LR=1 aktiviert Long-Range-Modus (~1/4 Datenrate, mehr Reichweite).
; Sender und Empfaenger muessen denselben WiFi-Kanal und LR-Modus nutzen.
[env:sender]
build_flags =
    -D ROLE_SENDER=1
    -D NODE_ID=1
    -D ESPNOW_CHANNEL=1
    -D ESPNOW_LR=0

[env:receiver]
build_flags =
    -D ROLE_RECEIVER=1
    -D NODE_ID=7
    -D ESPNOW_CHANNEL=1
    -D ESPNOW_LR=0

[env:relay5]
build_flags =
    -D ROLE_RELAY=1
    -D NODE_ID=5
    -D ESPNOW_CHANNEL=1
    -D ESPNOW_LR=0

[env:relay6]
build_flags =
    -D ROLE_RELAY=1
    -D NODE_ID=6
    -D ESPNOW_CHANNEL=1
    -D ESPNOW_LR=0

; ===== AUTO TOPOLOGY BLOCK BEGIN =====
; auto-generiert vom Topologie-Wizard (1 Kette(n) a 2 Relay(s), Kanal 1, LR=0)
; NICHT manuell editieren. Der Block wird beim naechsten Plan vollstaendig ersetzt.

[env:auto_sender]
build_flags =
    -D ROLE_SENDER=1
    -D NODE_ID=1
    -D ESPNOW_CHANNEL=1
    -D ESPNOW_LR=0
    -D ALLOWED_PREV_MASK=0x00000004

[env:auto_c1_relay1]
build_flags =
    -D ROLE_RELAY=1
    -D NODE_ID=2
    -D ESPNOW_CHANNEL=1
    -D ESPNOW_LR=0
    -D ALLOWED_PREV_MASK=0x0000000A

[env:auto_c1_relay2]
build_flags =
    -D ROLE_RELAY=1
    -D NODE_ID=3
    -D ESPNOW_CHANNEL=1
    -D ESPNOW_LR=0
    -D ALLOWED_PREV_MASK=0x00000014

[env:auto_c1_recv]
build_flags =
    -D ROLE_RECEIVER=1
    -D NODE_ID=4
    -D ESPNOW_CHANNEL=1
    -D ESPNOW_LR=0
    -D ALLOWED_PREV_MASK=0x00000008
; ===== AUTO TOPOLOGY BLOCK END =====
